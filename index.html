<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>课堂提问点名 · 座次表随机抽答</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap"></noscript>
<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --line:#e3e9e7; --line2:#d4ddd9;
  --ink:#1d2b28; --ink2:#5c6b66; --ink3:#93a29d;
  --brand:#0f766e; --brand-d:#0b4f4a; --brand-l:#e3f2f0;
  --amber:#d97706; --amber-d:#b45309; --amber-l:#fdf0dc;
  --danger:#dc2626; --danger-l:#fdeaea;
  --ok:#15803d; --ok-l:#e6f6ea;
  --boy:#dbeafe; --boy-b:#3b82f6; --boy-t:#1d4ed8;
  --girl:#fce7f3; --girl-b:#ec4899; --girl-t:#be185d;
  --shadow:0 1px 3px rgba(20,40,35,.08),0 8px 24px rgba(20,40,35,.06);
  --r:12px; --r-sm:8px;
  --font:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 8px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
textarea{resize:vertical}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c8d2cf;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;flex-direction:column;min-height:100vh}

/* ===== 顶栏 ===== */
.topbar{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 20px;min-height:58px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.topbar .logo{display:flex;align-items:center;gap:9px;margin-right:4px}
.topbar .logo .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2dd4bf,#0f766e);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:18px}
.topbar h1{font-size:15px;font-weight:900;white-space:nowrap;line-height:1.2}
.topbar h1 small{display:block;font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:1px}
.cls-tabs{display:inline-flex;background:#e9efed;border-radius:10px;padding:3px;gap:2px}
.cls-tabs button{padding:6px 16px;border-radius:8px;font-size:14px;color:var(--ink2);font-weight:600;transition:all .15s}
.cls-tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.topbar .spacer{flex:1}
.topbar .actions{display:flex;gap:6px;flex-wrap:wrap}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .15s;white-space:nowrap;border:1px solid transparent}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-amber{background:var(--amber-d);color:#fff}
.btn-amber:hover{background:#92400e}
.btn-ghost{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#fff;border-color:#f3c1c1;color:var(--danger)}
.btn-danger:hover{background:var(--danger-l)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{background:#166534}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn-lg{padding:12px 28px;font-size:16px;border-radius:12px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);border:1px solid var(--line2);background:#fff;transition:all .15s}
.icon-btn:hover{color:var(--brand);border-color:var(--brand)}
.icon-btn svg{width:15px;height:15px}

/* ===== 统计栏 ===== */
.stats-bar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.stats-bar .stat{display:flex;align-items:center;gap:5px}
.stats-bar .stat b{font-size:15px;font-weight:800}
.stats-bar .stat .lbl{color:var(--ink3)}
.stats-bar .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats-bar .dot.boy{background:var(--boy-b)}
.stats-bar .dot.girl{background:var(--girl-b)}
.stats-bar .dot.wait{background:var(--ink3)}
.stats-bar .dot.ans{background:var(--ok)}
.stats-bar .spacer{flex:1}

/* ===== 主区域 ===== */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding:16px 20px 40px;align-items:start;max-width:1600px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700;flex:1}
.card-h .sub{font-size:12px;color:var(--ink3);font-weight:400}
.muted{color:var(--ink3);font-size:12px}
.flex{display:flex;gap:10px;align-items:center}
.flex.between{justify-content:space-between}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%}

/* ===== 座位舞台 ===== */
.stage-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;overflow:hidden;position:relative}
.stage-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.stage-body{display:flex;flex-direction:column;align-items:center}
.stage-body.flip{flex-direction:column-reverse}
.board{position:relative;margin:0 auto;width:max-content}
.podium{background:linear-gradient(180deg,#0f766e,#0b4f4a);color:#fff;text-align:center;padding:8px 26px;border-radius:9px;font-weight:800;font-size:14px;letter-spacing:5px;width:max-content;margin:0 0 18px;box-shadow:0 4px 12px rgba(11,79,74,.22);flex:none}
.stage-body.flip .podium{margin:18px 0 0}
.row{display:flex;margin-bottom:5px;justify-content:center}
.row:last-child{margin-bottom:0}
.seat{position:relative;width:78px;height:40px;border-radius:7px;border:2px solid #cbd9d4;background:#fff;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;cursor:pointer;user-select:none;transition:transform .1s,box-shadow .12s,border-color .12s;padding:2px 6px}
.seat:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(15,118,110,.18);transform:translateY(-1px)}
.seat.g-boy{background:var(--boy);border-color:var(--boy-b)}
.seat.g-boy .nm{color:var(--boy-t)}
.seat.g-girl{background:var(--girl);border-color:var(--girl-b)}
.seat.g-girl .nm{color:var(--girl-t)}
.seat.empty{background:#f6f8f7;border-style:dashed;border-color:#d4ddd9}
.seat.empty .nm{color:var(--ink3);font-size:12px}
.seat .sno{font-size:10px;color:#9db0aa;font-weight:700;line-height:1;flex:none}
.seat .nm{font-size:14px;font-weight:800;text-align:center;line-height:1.1;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .ans-mark{position:absolute;bottom:-1px;right:3px;font-size:10px;color:var(--ok);font-weight:900;line-height:1}
.seat.rolling{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.55),0 0 18px rgba(245,158,11,.5);transform:scale(1.08);z-index:5}
.seat.picked{border-color:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.5),0 0 20px rgba(21,128,61,.45);transform:scale(1.06);z-index:5;animation:pulse 1.2s ease infinite}
.seat.dragging,.stu-chip.dragging{opacity:.4}
.seat.drag-over{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.45);transform:scale(1.06);z-index:6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(21,128,61,.5),0 0 20px rgba(21,128,61,.45)}50%{box-shadow:0 0 0 5px rgba(21,128,61,.35),0 0 30px rgba(21,128,61,.6)}}
.legend{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:16px;height:12px;border-radius:3px;border:1.5px solid;display:inline-block}
.legend .sw.boy{background:var(--boy);border-color:var(--boy-b)}
.legend .sw.girl{background:var(--girl);border-color:var(--girl-b)}
.legend .sw.wait{background:#fff;border-color:var(--line2);border-style:dashed}
.legend .sw.ans{background:#fff;border-color:var(--ok)}

/* ===== 点名面板 ===== */
.roll-box{background:linear-gradient(160deg,#0f766e,#0b4f4a);border-radius:var(--r);padding:20px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(11,79,74,.3)}
.roll-display{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-bottom:14px}
.roll-display .big{font-size:34px;font-weight:900;letter-spacing:2px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.roll-display .sub{font-size:12px;color:rgba(255,255,255,.75)}
.roll-display.rolling .big{animation:flicker .08s linear infinite}
@keyframes flicker{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.roll-btn{width:100%;padding:14px;font-size:17px;font-weight:800;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.4);transition:all .15s;letter-spacing:2px}
.roll-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(217,119,6,.5)}
.roll-btn:active{transform:translateY(0)}
.roll-btn.stop{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(220,38,38,.4)}
.roll-opts{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:rgba(255,255,255,.85)}
.roll-opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
.roll-opts input{accent-color:#f59e0b}
.roll-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.roll-stats .rs{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.roll-stats .rs b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.roll-stats .rs span{font-size:11px;color:var(--ink3)}
.roll-actions{display:flex;gap:8px;margin-bottom:14px}
.roll-actions .btn{flex:1}

/* ===== 语音控制 ===== */
.voice-bar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:10px}
.voice-btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.voice-btn:hover{background:rgba(255,255,255,.3)}
.voice-btn.active{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 0 0 3px rgba(239,68,68,.3);animation:voicepulse 1.2s ease-in-out infinite}
@keyframes voicepulse{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,.1)}}
.voice-status{flex:1;font-size:12px;color:rgba(255,255,255,.8);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-status .cmd{color:#fde047;font-weight:700}
.voice-hint{font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.5}

/* ===== 侧栏标签 ===== */
.seg{display:flex;background:#e9efed;border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:12.5px;color:var(--ink2);font-weight:600;transition:all .15s}
.seg button.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ===== 点名记录 ===== */
.hist-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.hist-item:last-child{border-bottom:none}
.hist-item .idx{width:22px;height:22px;border-radius:50%;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.hist-item .nm{font-weight:700;flex:1}
.hist-item .tm{color:var(--ink3);font-size:11px}
.hist-item .seat-tag{font-size:10px;background:var(--brand-l);color:var(--brand);padding:1px 6px;border-radius:4px;font-weight:600}

/* ===== 名单编辑表格 ===== */
.roster-table{width:100%;border-collapse:collapse;font-size:12.5px}
.roster-table th{background:#f4f7f6;color:var(--ink2);font-weight:700;padding:7px 6px;text-align:left;font-size:11.5px;border-bottom:2px solid var(--line);position:sticky;top:0}
.roster-table td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.roster-table tr:hover td{background:#f8faf9}
.roster-table .seat-no{font-weight:800;color:var(--brand);width:40px;text-align:center}
.roster-table .name{font-weight:700;min-width:60px}
.roster-table .name.boy{color:var(--boy-t)}
.roster-table .name.girl{color:var(--girl-t)}
.roster-table .name.wait{color:var(--ink3)}
.roster-table select{padding:3px 6px;font-size:12px;width:100%;min-width:56px}
.roster-table input{padding:3px 6px;font-size:12px;width:100%;min-width:50px}
.roster-table .op{width:50px;text-align:center}
.roster-table .op .btn{padding:2px 7px;font-size:11px}
.roster-wrap{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.roster-toolbar{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.roster-toolbar input{flex:1;min-width:100px}

/* ===== 未安排 ===== */
.stu-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:#fff;border:1px solid var(--line2);font-size:12px;font-weight:600;margin:3px;cursor:grab;transition:all .12s}
.stu-chip:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(15,118,110,.12)}
.stu-chip .av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.stu-chip .av.boy{background:var(--boy);color:var(--boy-t)}
.stu-chip .av.girl{background:var(--girl);color:var(--girl-t)}
.stu-chip .av.wait{background:var(--brand-l);color:var(--brand)}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,30,27,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:480px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .2s ease}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800}
.modal-h .close{margin-left:auto;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:18px;cursor:pointer;transition:all .12s;flex:none}
.modal-h .close:hover{background:var(--danger-l);color:var(--danger)}
.modal-b{padding:18px 20px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#fafcfb}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ===== Toast ===== */
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#12312c;color:#eaf6f3;padding:9px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease;max-width:80vw}
.toast.err{background:#7f1d1d}
.toast.ok{background:#14532d}
@keyframes tin{0%{transform:translateY(-12px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ===== 头像弹窗 ===== */
.avatar-pop-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:150;display:flex;align-items:center;justify-content:center;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.avatar-pop{background:linear-gradient(160deg,#ffffff,#f0f7f5);border-radius:24px;padding:36px 48px 32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:popin .35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;position:relative}
@keyframes popin{0%{transform:scale(.5) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.avatar-pop .close-x{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:18px;color:#666;cursor:pointer;transition:all .15s}
.avatar-pop .close-x:hover{background:#dc2626;color:#fff}
.avatar-pop .av-ring{width:200px;height:200px;border-radius:50%;margin:0 auto 18px;padding:6px;background:conic-gradient(from 0deg,#ef4444,#f59e0b,#ef4444);box-shadow:0 0 0 4px #fff,0 0 30px rgba(239,68,68,.5),0 10px 30px rgba(0,0,0,.2)}
.avatar-pop .av-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}
.avatar-pop .av-default{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#fff;background:linear-gradient(135deg,#0f766e,#14b8a6)}
.avatar-pop .av-default.boy{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.avatar-pop .av-default.girl{background:linear-gradient(135deg,#db2777,#f472b6)}
.avatar-pop .pname{font-size:42px;font-weight:900;color:#0f172a;letter-spacing:4px;margin-bottom:6px;text-shadow:0 2px 4px rgba(0,0,0,.08)}
.avatar-pop .pinfo{font-size:15px;color:#64748b;font-weight:600}
.avatar-pop .pinfo span{display:inline-block;margin:0 6px;padding:3px 12px;border-radius:20px;background:#e2e8f0}
.avatar-pop .pinfo span.boy{background:#dbeafe;color:#1d4ed8}
.avatar-pop .pinfo span.girl{background:#fce7f3;color:#be185d}
.avatar-pop .pop-actions{display:flex;gap:14px;justify-content:center;margin-top:22px}
.avatar-pop .pop-btn{padding:11px 26px;border-radius:12px;font-size:15px;font-weight:800;letter-spacing:1px;transition:all .15s;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.avatar-pop .pop-btn.like{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.avatar-pop .pop-btn.like:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(34,197,94,.45)}
.avatar-pop .pop-btn.cheer{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.avatar-pop .pop-btn.cheer:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(245,158,11,.45)}
.avatar-pop .pop-btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* 烟花特效 */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.rocket{position:absolute;bottom:-14px;width:7px;height:26px;background:linear-gradient(to top,transparent,#fde047 30%,#fff 80%);border-radius:4px;animation:rocket-up 1s ease-out forwards;box-shadow:0 0 10px #fbbf24,0 0 22px #f59e0b,0 0 40px rgba(251,191,36,.5),0 0 60px rgba(251,191,36,.25);z-index:2}
@keyframes rocket-up{
  0%{transform:translateY(0) scale(1);opacity:1}
  70%{opacity:1}
  100%{transform:translateY(var(--rise)) scale(.7);opacity:.9}
}
.burst-flash{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,240,180,.6) 30%,rgba(255,200,80,.2) 60%,transparent 75%);animation:flash-pop .5s ease-out forwards;pointer-events:none;z-index:1}
@keyframes flash-pop{
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}
}
.spark{position:absolute;border-radius:50%;animation:spark-burst ease-out forwards;will-change:transform,opacity}
.spark.glow{box-shadow:0 0 8px currentColor,0 0 16px currentColor,0 0 28px rgba(255,255,255,.3)}
.spark.big{box-shadow:0 0 12px currentColor,0 0 24px currentColor,0 0 40px rgba(255,255,255,.4)}
.spark::after{content:'';position:absolute;top:50%;left:50%;width:40%;height:2px;background:linear-gradient(to right,currentColor,transparent);transform:translate(-100%,-50%);opacity:.5;border-radius:1px}
@keyframes spark-burst{
  0%{transform:translate(-50%,-50%) scale(1.6);opacity:1}
  18%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1.1);opacity:1}
  40%{transform:translate(calc(-50% + var(--tx)*1.06),calc(-50% + var(--ty) + 8vh)) scale(.95);opacity:.92}
  60%{transform:translate(calc(-50% + var(--tx)*1.1),calc(-50% + var(--ty) + 25vh)) scale(.8);opacity:.72}
  78%{transform:translate(calc(-50% + var(--tx)*1.14),calc(-50% + var(--ty) + 48vh)) scale(.62);opacity:.45}
  90%{transform:translate(calc(-50% + var(--tx)*1.18),calc(-50% + var(--ty) + 65vh)) scale(.45);opacity:.2}
  100%{transform:translate(calc(-50% + var(--tx)*1.22),calc(-50% + var(--ty) + 82vh)) scale(.3);opacity:0}
}

/* 加油文字特效 */
.cheer-layer{position:fixed;inset:0;pointer-events:none;z-index:300;display:flex;align-items:center;justify-content:center}
.cheer-big{font-size:96px;font-weight:900;color:#f59e0b;text-shadow:0 4px 30px rgba(0,0,0,.3),0 0 60px rgba(245,158,11,.4);letter-spacing:8px;animation:cheer-pop 2.8s ease forwards}
@keyframes cheer-pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}15%{transform:scale(1.3) rotate(3deg);opacity:1}30%{transform:scale(1) rotate(0deg);opacity:1}80%{transform:scale(1.05);opacity:1}100%{transform:scale(1.2);opacity:0}}

/* ===== 打印 ===== */
@media print{
  body{background:#fff}
  .topbar,.stats-bar,.side,.no-print,.roll-box,.roll-stats,.roll-actions,.seg{display:none !important}
  .main{display:block !important;padding:0;max-width:none;grid-template-columns:1fr}
  .stage-wrap{border:none;box-shadow:none;padding:0;overflow:visible}
  .seat{width:64px;height:56px;border-width:1.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .seat.g-boy,.seat.g-girl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:10mm}
}

/* ===== 响应式 ===== */
@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr);padding:14px 14px 40px}
  .stage-wrap{order:2}
  .side{order:1;min-width:0;max-width:760px;margin:0 auto;width:100%}
  .seat{width:64px;height:58px}
}

  body{overflow-x:hidden}
  .topbar{padding:8px 12px}
  .topbar h1{font-size:14px}

  .stage-wrap{padding:12px 8px}
  .card{padding:12px}
  .roster-wrap{max-height:340px}
}

      <div class="roll-actions no-print">

        <button class="btn btn-danger btn-sm" id="btn-clearhist">🧹 清记录</button>

    </aside>
  </main>

/* ===== 工具函数 ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const uid = p => (p||'s') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const nowTime = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* ===== 布局引擎 ===== */
const DEFAULT_LAYOUT = { cols:9, rows:8, colGroups:[3,3,3] };
const seatNoOf = (x,y) => y*10 + x;
const coordsOf = seatNo => { const n = Math.max(1, Math.round(seatNo)); return { x: n%10, y: Math.floor(n/10) }; };
const seatKey = (x,y) => x+'-'+y;
const getSeats = ly => { const a=[]; for(let y=1;y<=ly.rows;y++) for(let x=1;x<=ly.cols;x++) a.push({x,y}); return a; };

/* ===== 状态 ===== */
const LS_KEY = 'rollcall-app-v2';
let S = null;
function newClass(name, data){
  const students = data.map((d,i) => {
    const c = coordsOf(Number(d[3])||0);
    return { id:uid('s'), n:d[0], g:d[1]||'', no:d[2]||'', x:c.x||0, y:c.y||0, rk:i+1, avatar:'' };
  });
  return { name, students, history:[], called:[], placed:true };
}
function freshState(){
  return {
    classes: { '49班': newClass('49班', R_49班), '50班': newClass('50班', R_50班) },
    layout: {...DEFAULT_LAYOUT},
    cur: '49班',
    noRepeat: true,
    showSeat: true,
    flipPodium: false
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ S = JSON.parse(raw); }
  }catch(e){}
  if(!S) S = freshState();
  ensureAvatars();
}
function ensureAvatars(){
  if(typeof AVATAR_POOL === 'undefined' || !AVATAR_POOL.length) return;
  let changed = false;
  Object.values(S.classes).forEach(cc => {
    cc.students.forEach(s => {
      if(!s.avatar){
        s.avatar = AVATAR_POOL[Math.floor(Math.random()*AVATAR_POOL.length)];
        changed = true;
      }
    });
  });
  if(changed) save();
}
function save(silent){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
const curClass = () => S.classes[S.cur];
const studentAt = (x,y) => curClass().students.find(s => s.x===x && s.y===y);
const studentById = id => curClass().students.find(s => s.id===id);
const placedStudents = () => curClass().students.filter(s => s.x>0 && s.y>0);
const unplacedStudents = () => curClass().students.filter(s => !(s.x>0 && s.y>0));

/* ===== 点名引擎 ===== */
let rolling = false, rollTimer = null, rollPool = [], rollIdx = 0, autoStopTimer = null, autoStopCount = 0;
function getRollPool(){
  const cc = curClass();
  let pool = placedStudents();
  if(S.noRepeat) pool = pool.filter(s => !cc.called.includes(s.id));
  if(!pool.length && S.noRepeat){
    pool = placedStudents();
  }
  return pool;
}
function startRoll(){
  const pool = getRollPool();
  if(!pool.length){ toast('没有可点名的学生','err'); return; }
  rolling = true;
  rollPool = pool;
  autoStopCount = 5;
  $('#roll-btn').textContent = '⏹ 停止 (5s)';
  $('#roll-btn').classList.add('stop');
  $('#roll-display').classList.add('rolling');
  let i = 0;
  rollTimer = setInterval(() => {
    const st = rollPool[Math.floor(Math.random() * rollPool.length)];
    i++;
    $('#roll-display').innerHTML = `<div class="big">${esc(st.n)}</div><div class="sub">${S.showSeat && st.x ? '座位号 '+seatNoOf(st.x,st.y)+'（第'+st.y+'排第'+st.x+'列）' : (st.g||'')}</div>`;
    $$('.seat.rolling').forEach(el => el.classList.remove('rolling'));
    const el = document.querySelector('.seat[data-key="'+seatKey(st.x,st.y)+'"]');
    if(el) el.classList.add('rolling');
  }, 70);
  // 5秒自动停止，每秒更新倒计时
  autoStopTimer = setInterval(() => {
    autoStopCount--;
    if(autoStopCount > 0){
      $('#roll-btn').textContent = '⏹ 停止 ('+autoStopCount+'s)';
    } else {
      stopRoll();
    }
  }, 1000);
}
function stopRoll(){
  if(!rolling) return;
  clearInterval(rollTimer);
  clearInterval(autoStopTimer);
  autoStopTimer = null;
  rolling = false;
  $('#roll-btn').textContent = '▶ 开始点名';
  $('#roll-btn').classList.remove('stop');
  $('#roll-display').classList.remove('rolling');
  $$('.seat.rolling').forEach(el => el.classList.remove('rolling'));
  // 随机定格
  const pool = rollPool.length ? rollPool : getRollPool();
  if(!pool.length) return;
  const st = pool[Math.floor(Math.random()*pool.length)];
  pickStudent(st, false);
}
function pickStudent(st, manual){
  const cc = curClass();
  if(!cc.called.includes(st.id)) cc.called.push(st.id);
  cc.history.unshift({ id:uid('h'), sid:st.id, n:st.n, seat: st.x?seatNoOf(st.x,st.y):0, time:nowTime(), manual:!!manual });
  if(cc.history.length > 200) cc.history.length = 200;
  save();
  $('#roll-display').innerHTML = `<div class="big" style="color:#fde68a">${esc(st.n)}</div><div class="sub">${st.x ? '座位号 '+seatNoOf(st.x,st.y)+'（第'+st.y+'排第'+st.x+'列）' : ''}${st.g?' · '+st.g:''}</div>`;
  renderBoard();
  const el = document.querySelector('.seat[data-key="'+seatKey(st.x,st.y)+'"]');
  if(el) el.classList.add('picked');
  renderStats();
  renderHistory();
  toast(st.n + (manual ? ' 已点名' : ' 来回答问题'), 'ok');
  showAvatarPop(st);
}

/* ===== 头像弹窗 ===== */
function showAvatarPop(st){
  closeAvatarPop();
  const seatNo = st.x ? seatNoOf(st.x,st.y) : '';
  const avHTML = st.avatar
    ? `<img src="${st.avatar}" alt="${esc(st.n)}">`
    : `<div class="av-default ${st.g==='男'?'boy':st.g==='女'?'girl':''}">${esc(st.n[0])}</div>`;
  const gTag = st.g ? `<span class="${st.g==='男'?'boy':st.g==='女'?'girl':''}">${st.g}</span>` : '';
  const seatTag = seatNo ? `<span>座位 ${seatNo} 号</span>` : '';
  const noTag = st.no ? `<span>学号 ${esc(st.no)}</span>` : '';
  const mask = document.createElement('div');
  mask.className = 'avatar-pop-mask';
  mask.id = 'avatar-pop-mask';
  mask.innerHTML = `<div class="avatar-pop">
    <span class="close-x" id="av-close">✕</span>

    </div>

}
let popTimer = null;
function popFeedback(type){
  if(popTimer){ clearTimeout(popTimer); popTimer = null; }
  const likeBtn = $('#av-like'), cheerBtn = $('#av-cheer');
  if(likeBtn) likeBtn.disabled = true;
  if(cheerBtn) cheerBtn.disabled = true;
  if(type === 'like'){
    launchConfetti();
  } else {
    launchCheer();
  }
  popTimer = setTimeout(() => {
    closeAvatarPop();
    $$('.seat.picked').forEach(el => el.classList.remove('picked'));
    $('#roll-display').innerHTML = '<div class="big">点击下方按钮</div><div class="sub">开始随机点名抽答</div>';
    popTimer = null;
  }, 5000);
}
function launchConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const colors = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#ec4899','#f43f5e','#fff','#fde047'];
  // 5发烟花，从中间区域错落发射
  const fireworks = [
    { x:50, rise:-58, delay:0 },
    { x:32, rise:-48, delay:0.35 },
    { x:68, rise:-52, delay:0.7 },
    { x:45, rise:-68, delay:1.05 },
    { x:58, rise:-44, delay:1.4 },
  ];
  fireworks.forEach(fw => {
    setTimeout(() => {
      const rocket = document.createElement('div');
      rocket.className = 'rocket';
      rocket.style.left = fw.x + '%';
      rocket.style.setProperty('--rise', fw.rise + 'vh');
      layer.appendChild(rocket);
      // 1秒后爆炸
      setTimeout(() => {
        rocket.remove();
        createBurst(layer, fw.x, 100 + fw.rise, colors);
      }, 1000);
    }, fw.delay * 1000);
  });
  setTimeout(() => layer.remove(), 6500);
}
function createBurst(layer, xPct, yVh, colors){
  // 爆炸闪光
  const flash = document.createElement('div');
  flash.className = 'burst-flash';
  flash.style.left = xPct + '%';
  flash.style.top = yVh + 'vh';
  flash.style.width = '180px';
  flash.style.height = '180px';
  layer.appendChild(flash);
  setTimeout(() => flash.remove(), 600);
  const count = 120 + Math.floor(Math.random()*60);
  for(let i=0;i<count;i++){
    const spark = document.createElement('div');
    spark.className = 'spark';
    const r = Math.random();
    if(r < 0.55) spark.classList.add('glow');
    else if(r < 0.72) spark.classList.add('big');
    spark.style.left = xPct + '%';
    spark.style.top = yVh + 'vh';
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 260;
    spark.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    spark.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    const color = colors[Math.floor(Math.random()*colors.length)];
    spark.style.background = color;
    spark.style.color = color;
    const isBig = spark.classList.contains('big');
    const size = isBig ? (10 + Math.random()*7) : (5 + Math.random()*6);
    spark.style.width = size + 'px';
    spark.style.height = size + 'px';
    spark.style.animationDuration = (2 + Math.random()*1.2) + 's';
    spark.style.animationDelay = (Math.random()*0.06) + 's';
    layer.appendChild(spark);
  }
}
function launchCheer(){
  const layer = document.createElement('div');
  layer.className = 'cheer-layer';
  layer.innerHTML = '<div class="cheer-big">继续加油 ✊</div>';
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 3000);
}

function readAvatarFile(file, cb){
  if(!file || !file.type.startsWith('image/')){ toast('请选择图片文件','err'); return; }

/* ===== 渲染：座位图 ===== */
function renderBoard(){
  const ly = S.layout, cc = curClass();
  const byKey = {};
  cc.students.forEach(s => { if(s.x>0 && s.y>0) byKey[seatKey(s.x,s.y)] = s; });
  const groups = ly.colGroups && ly.colGroups.length ? ly.colGroups : [ly.cols];
  const placed = placedStudents().length;
  const empty = ly.cols*ly.rows - placed;
  $('#stage-info').textContent = `共 ${cc.students.length} 人 · 已安排 ${placed} 人 · 空座 ${empty} 个 · 座位号=排×10+列`;
  $('#podium').textContent = cc.name + ' · 讲 台';
  $('#stage-body').classList.toggle('flip', S.flipPodium);
  let html = '';
  const rows = S.flipPodium ? [...Array(ly.rows)].map((_,i)=>i+1).reverse() : [...Array(ly.rows)].map((_,i)=>ly.rows-i);
  for(const y of rows){
    html += '<div class="row">';
    let gIdx = 0, inGroup = 0;
    for(let x=1; x<=ly.cols; x++){
      if(inGroup >= groups[gIdx]){ html += '<div style="width:18px"></div>'; gIdx++; inGroup=0; }
      inGroup++;
      const st = byKey[seatKey(x,y)];
      const no = seatNoOf(x,y);
      const gcls = st ? (st.g==='男'?' g-boy':st.g==='女'?' g-girl':'') : ' empty';
      const ansMark = st && cc.called.includes(st.id) ? '<span class="ans-mark">✓</span>' : '';
      html += `<div class="seat${gcls}" data-key="${x}-${y}" data-x="${x}" data-y="${y}" data-sid="${st?st.id:''}">
        <span class="sno">${no}</span>
        ${st ? `<span class="nm">${esc(st.n)}</span>${ansMark}` : '<span class="nm">空</span>'}
      </div>`;
    }
    html += '</div>';
  }
  $('#board').innerHTML = html;
  $$('#board .seat').forEach(el => {
    el.onclick = () => seatClick(el.dataset.key, el);
    bindDragEl(el);
  });
  fitBoard();
}

/* ===== 座位图自适应缩放 ===== */
function fitBoard(){
  const board = $('#board');
  if(!board) return;
  const wrap = $('#stage');
  const wrapW = wrap.clientWidth - 36;
  const wrapH = window.innerHeight - 250;
  const boardW = board.scrollWidth;
  const boardH = board.scrollHeight;
  const scale = Math.min(wrapW / boardW, wrapH / boardH);
  board.style.zoom = scale;
}

/* ===== 拖拽 ===== */
let dragEl = null, dSX=0, dSY=0, dMoved=false, suppressClick=false;
function bindDragEl(el){
  el.addEventListener('pointerdown', e => {
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target.closest('button') || e.target.tagName==='SELECT' || e.target.tagName==='INPUT') return;
    const seat = el.classList.contains('seat') ? el : null;
    const chip = el.classList.contains('stu-chip') ? el : null;
    if(!seat && !chip) return;
    suppressClick = false;
    dragEl = { el, seat: seat ? seat.dataset.key : null, sid: chip ? chip.dataset.sid : (seat ? (seat.dataset.sid || null) : null) };
    dSX = e.clientX; dSY = e.clientY; dMoved = false;
    el.classList.add('dragging');
    e.preventDefault();
  });
}
window.addEventListener('pointermove', e => {
  if(!dragEl) return;
  if(Math.abs(e.clientX-dSX)+Math.abs(e.clientY-dSY) > 5) dMoved = true;
  if(!dMoved) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const over = t && t.closest ? t.closest('.seat') : null;
  $$('.seat.drag-over').forEach(x => x.classList.remove('drag-over'));
  if(over) over.classList.add('drag-over');
});
window.addEventListener('pointerup', e => {
  if(!dragEl) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const over = t && t.closest ? t.closest('.seat') : null;
  dragEl.el.classList.remove('dragging');
  $$('.seat.drag-over').forEach(x => x.classList.remove('drag-over'));
  if(over && over.dataset.key !== dragEl.seat){
    doAssign(dragEl.sid, dragEl.seat, over.dataset.key);
    suppressClick = true;
  }
  dragEl = null;
});
function doAssign(sid, fromKey, toKey){
  const [tx,ty] = toKey.split('-').map(Number);
  const st = studentById(sid);
  if(!st) return;
  const occ = studentAt(tx,ty);
  if(occ && occ.id === sid) return;
  if(fromKey){
    const [fx,fy] = fromKey.split('-').map(Number);
    if(occ){ occ.x = fx; occ.y = fy; }
  } else if(occ){
    toast('座位 '+toKey+' 已被 '+occ.n+' 占用','err');
    return;
  }
  st.x = tx; st.y = ty;
  save(); render();
  toast(st.n + (occ ? ' 与 '+occ.n+' 互换' : ' → 座位 '+toKey), 'ok');
}

/* ===== 自动入座 / 清空 ===== */
function autoSeat(){
  const cc = curClass(), ly = S.layout;
  const unplaced = unplacedStudents().sort((a,b)=>(a.rk||9999)-(b.rk||9999));
  let idx = 0;
  for(let y=1; y<=ly.rows && idx<unplaced.length; y++){
    const xs = []; for(let x=1;x<=ly.cols;x++) xs.push(x);
    if(y%2===0) xs.reverse();
    for(const x of xs){ if(idx>=unplaced.length) break; if(!studentAt(x,y)){ unplaced[idx].x=x; unplaced[idx].y=y; idx++; } }
  }
  save(); render();
  toast('自动入座完成：新安排 '+idx+' 人','ok');
}
function clearSeats(){
  const cc = curClass();
  cc.students.forEach(s => { s.x=0; s.y=0; });
  cc.called = []; cc.history = [];
  save(); render();
  toast('已清空所有座位和点名记录','ok');
}

/* ===== 导入名单 ===== */
function detectDelim(text){
  const sample = text.split(/\r?\n/).slice(0,6).join('\n');
  let best='\t', bestN=0;
  [',','，',';','\t','  ','　'].forEach(d => { const n = sample.split(d).length; if(n>bestN){ bestN=n; best=d; } });
  return best;
}
function parseRosterText(text){
  const delim = detectDelim(text);
  const rows = text.split(/\r?\n/).map(l => l.replace(/\r$/,'').split(delim).map(c=>c.trim())).filter(r => r.some(c=>c!==''));
  if(!rows.length) return [];
  const kw = ['班级','姓名','名字','name','学号','性别','座位号','横坐标','纵坐标','列','排','x','y','语文排名','排名','头像','avatar','photo','照片'];
  const isHeader = rows[0].some(c => kw.includes(c.toLowerCase()) || /班级|姓名|学号|性别|座位|坐标|排名/.test(c));
  const hdr = isHeader ? rows.shift() : null;
  const findIdx = names => hdr ? hdr.findIndex(c => names.some(n => c.toLowerCase()===n || (n.length>=2 && (c.includes(n)||n.includes(c))))) : -1;
  const iCls = findIdx(['班级']);
  const iN = hdr ? findIdx(['姓名','名字','name']) : 0;
  const iNo = hdr ? findIdx(['学号']) : 1;
  const iG = hdr ? findIdx(['性别']) : 2;
  const iSn = hdr ? findIdx(['座位号','座号']) : 3;
  const iX = hdr ? findIdx(['横坐标','横','列','x']) : 4;
  const iY = hdr ? findIdx(['纵坐标','纵','排','y']) : 5;
  const iRk = hdr ? findIdx(['排名','名次']) : 6;
  const iAv = hdr ? findIdx(['头像','avatar','photo','照片']) : 7;
  const out = [];
  rows.forEach(r => {
    const name = r[iN];
    if(!name) return;
    let x = num(r[iX]), y = num(r[iY]);
    const sn = num(r[iSn]);
    if((!x||!y) && sn && sn>=11){ const c=coordsOf(sn); x=c.x; y=c.y; }
    out.push({
      cls: (r[iCls]||'').trim(), n: name.trim(),
      no: (r[iNo]||'').trim(), g: (r[iG]||'').trim(),
      rk: num(r[iRk])||0,
      avatar: (r[iAv]||'').trim(),
      x: (Number.isInteger(x)&&x>0)?x:0, y: (Number.isInteger(y)&&y>0)?y:0
    });
  });
  return out;
}
function importModal(){
  openModal({
    title: '导入名单（姓名/性别/学号/座位号）',
    wide: true,
    body: `<div class="muted" style="margin-bottom:10px;line-height:1.7">支持 CSV/TXT。可识别列：<b>姓名、性别、学号、座位号、横坐标、纵坐标、头像</b>。填写座位号或坐标的学生自动入座；性别可留空之后随时补录。模板格式：<code>姓名,性别,学号,座位号</code><br><span style="color:var(--brand)">头像请点顶部「🖼 导入头像」按钮批量上传图片，CSV 中头像列填图片文件名即可（如 郭雅轩.jpg）。</span></div>
    <div class="field" style="margin-bottom:10px"><label>导入方式</label>
      <select id="imp-mode"><option value="0">替换当前班名单</option><option value="1">追加到当前班（按姓名去重）</option></select></div>
    <div class="field"><label>粘贴名单内容，或选择文件</label>
      <textarea id="imp-text" rows="8" placeholder="姓名,性别,学号,座位号&#10;张三,男,2024001,11&#10;李四,女,2024002,12"></textarea>
      <input type="file" id="imp-file" accept=".csv,.txt" style="margin-top:8px"></div>
    <div id="imp-preview" class="muted" style="margin-top:8px"></div>`,
    footer: `<button class="btn btn-ghost" data-c>取消</button><button class="btn btn-primary" id="imp-ok">导入</button>`
  });
  let parsed = [];
  const apply = text => {
    parsed = parseRosterText(text);
    const withCoord = parsed.filter(p=>p.x&&p.y).length;
    const cls = parsed.find(p=>p.cls)?.cls || S.cur;
    $('#imp-preview').innerHTML = parsed.length ? `解析成功 <b>${parsed.length}</b> 人（班级：${esc(cls)}），其中带座位 <b>${withCoord}</b> 人` : '<span style="color:var(--danger)">未解析出学生数据，请检查格式</span>';
  };
  $('#imp-text').oninput = e => apply(e.target.value);
  $('#imp-file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => { $('#imp-text').value = ev.target.result; apply(ev.target.result); };
    reader.readAsText(f, 'UTF-8');
  };
  $('#imp-ok').onclick = () => {
    if(!parsed.length){ toast('没有可导入的数据','err'); return; }
    const mode = parseInt($('#imp-mode').value);
    const byCls = {};
    parsed.forEach(p => { const k = p.cls || S.cur; (byCls[k]=byCls[k]||[]).push(p); });
    Object.entries(byCls).forEach(([cls, list]) => {
      if(!S.classes[cls]) S.classes[cls] = { name:cls, students:[], history:[], called:[], placed:true };
      const cc = S.classes[cls];
      if(mode===0){
        cc.students = list.map((p,i)=>({ id:uid('s'), n:p.n, no:p.no, g:p.g, rk:p.rk||i+1, x:p.x, y:p.y, avatar:p.avatar||'' }));
        cc.called = []; cc.history = [];
      } else {
        list.forEach(p => {
          const ex = cc.students.find(s=>s.n===p.n);
          if(ex){ ex.g=p.g||ex.g; ex.no=p.no||ex.no; if(p.avatar) ex.avatar=p.avatar; if(p.x){ex.x=p.x;ex.y=p.y;} }
          else cc.students.push({ id:uid('s'), n:p.n, no:p.no, g:p.g, rk:p.rk||cc.students.length+1, x:p.x, y:p.y, avatar:p.avatar||'' });
        });
      }
    });
    if(parsed.some(p=>p.cls)) S.cur = Object.keys(byCls)[0];
    save(); closeModal(); render();
    toast('导入完成：'+parsed.length+' 人','ok');
  };
}

function importAvatars(){
  openModal({
    title: '批量导入学生头像',
    wide: true,
    body: `<div class="muted" style="margin-bottom:12px;line-height:1.8">
      图片文件名自动匹配学生，支持以下命名方式（任选其一）：<br>
      • <b>姓名.jpg</b> — 如 <code>郭雅轩.jpg</code>、<code>侯若彤.png</code><br>
      • <b>学号.jpg</b> — 如 <code>2024011.jpg</code><br>
      • <b>座位号.jpg</b> — 如 <code>11.jpg</code>、<code>12.png</code><br>
      可一次选择多张图片，匹配成功后自动设置头像。未上传头像的学生点名时显示默认首字头像。
    </div>
    <div class="field"><label>选择头像图片（可多选，支持 jpg/png/webp）</label>
      <input type="file" id="av-files" accept="image/*" multiple style="margin-top:6px"></div>
    <div id="av-result" class="muted" style="margin-top:10px"></div>`,
    footer: `<button class="btn btn-ghost" data-c>关闭</button>`
  });
  $('#av-files').onchange = e => {
    const files = [...e.target.files];
    if(!files.length){ return; }
    const cc = curClass();
    let matched = 0, unmatched = [];
    let pending = files.length;
    files.forEach(file => {
      const fname = file.name.replace(/\.[^.]+$/, '').trim();
      // 匹配：姓名 → 学号 → 座位号
      let student = cc.students.find(s => s.n === fname)
                 || cc.students.find(s => s.no && s.no === fname)
                 || cc.students.find(s => { const seatNo = (s.y!=null&&s.x!=null) ? (s.y*10+s.x+1) : ''; return String(seatNo) === fname; });
      if(!student){
        // 尝试去掉下划线/空格后再匹配姓名
        const clean = fname.replace(/[_\s]/g,'');
        student = cc.students.find(s => s.n.replace(/\s/g,'') === clean);
      }
      if(!student){ unmatched.push(file.name); pending--; if(pending===0) finish(); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        student.avatar = ev.target.result;
        student.avatarName = file.name;
        matched++;
        pending--;
        if(pending===0) finish();
      };
      reader.onerror = () => { unmatched.push(file.name+'(读取失败)'); pending--; if(pending===0) finish(); };
      reader.readAsDataURL(file);
    });
    function finish(){
      save(); render();
      const unmatchHTML = unmatched.length ? `<br><span style="color:var(--danger)">未匹配 ${unmatched.length} 个：${unmatched.slice(0,8).map(esc).join('、')}${unmatched.length>8?'…':''}</span>` : '';
      $('#av-result').innerHTML = `<b style="color:var(--ok)">成功匹配 ${matched} 人</b>${unmatchHTML}`;
      toast('头像导入完成：成功'+matched+'人'+(unmatched.length?'，未匹配'+unmatched.length+'个':''), unmatched.length?'err':'ok');
    }
  };
}

function buildBoardHTML(ly, cc){
  const byKey = {};
  cc.students.forEach(s => { if(s.x>0&&s.y>0) byKey[seatKey(s.x,s.y)] = s; });
  const groups = ly.colGroups&&ly.colGroups.length ? ly.colGroups : [ly.cols];
  let h = '';
  for(let y=ly.rows; y>=1; y--){
    h += '<div style="display:flex;justify-content:center;margin-bottom:9px">';
    let gIdx=0, inGroup=0;
    for(let x=1;x<=ly.cols;x++){
      if(inGroup>=groups[gIdx]){ h+='<div style="width:16px"></div>'; gIdx++; inGroup=0; }
      inGroup++;
      const st = byKey[seatKey(x,y)];
      const bg = st ? (st.g==='男'?'#dbeafe':st.g==='女'?'#fce7f3':'#ffffff') : '#f4f7f6';
      const bd = st ? (st.g==='男'?'#3b82f6':st.g==='女'?'#ec4899':'#cbd9d4') : '#cbd9d4';
      h += `<div style="width:62px;height:52px;border:1.5px solid ${bd};border-radius:7px;background:${bg};display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:12px;margin:0 2px">
        <span style="position:absolute;top:1px;left:4px;font-size:8px;color:#93a29d;font-weight:700">${seatNoOf(x,y)}</span>
        <span style="font-weight:800">${st?esc(st.n):''}</span>
        ${st?`<span style="font-size:8px;color:#5c6b66">${st.g||''}${st.no?' · '+esc(st.no):''}</span>`:''}
      </div>`;
    }
    h += '</div>';
  }
  return h;
}

function exportPNG(){
  const cc = curClass(), ly = S.layout;
  const cellW=74, cellH=62, gapX=4, gapY=10, aisle=20;
  const groups = ly.colGroups&&ly.colGroups.length ? ly.colGroups : [ly.cols];
  const width = groups.reduce((a,g)=>a+g*cellW+(g-1)*gapX,0)+(groups.length-1)*aisle;
  const height = ly.rows*cellH+(ly.rows-1)*gapY;
  const pad=30, podiumH=44;
  const cv = document.createElement('canvas');
  cv.width = width+pad*2; cv.height = height+pad*2+podiumH;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#0f766e'; ctx.fillRect(cv.width/2-60, 16, 120, 28);
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText(cc.name+' 讲台', cv.width/2, 35);
  const byKey = {};
  cc.students.forEach(s => { if(s.x>0&&s.y>0) byKey[seatKey(s.x,s.y)] = s; });
  for(let y=ly.rows; y>=1; y--){
    let xPos=pad, gIdx=0, inGroup=0;
    for(let x=1;x<=ly.cols;x++){
      if(inGroup>=groups[gIdx]){ xPos+=aisle; gIdx++; inGroup=0; }
      inGroup++;
      const st = byKey[seatKey(x,y)];
      const bg = st ? (st.g==='男'?'#dbeafe':st.g==='女'?'#fce7f3':'#fff') : '#f6f8f7';
      const bd = st ? (st.g==='男'?'#3b82f6':st.g==='女'?'#ec4899':'#cbd9d4') : '#d4ddd9';
      const yPos = pad+podiumH+(ly.rows-y)*(cellH+gapY);
      ctx.fillStyle=bg; ctx.strokeStyle=bd; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(xPos,yPos,cellW,cellH,8); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#9db0aa'; ctx.font='bold 9px sans-serif'; ctx.textAlign='left';
      ctx.fillText(seatNoOf(x,y), xPos+5, yPos+12);
      if(st){
        ctx.fillStyle = st.g==='男'?'#1d4ed8':st.g==='女'?'#be185d':'#1d2b28';
        ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
        ctx.fillText(st.n, xPos+cellW/2, yPos+cellH/2+2);
        if(st.g||st.no){ ctx.fillStyle='#7a8a85'; ctx.font='8px sans-serif'; ctx.fillText((st.g||'')+(st.no?' · '+st.no:''), xPos+cellW/2, yPos+cellH-6); }
      } else {
        ctx.fillStyle='#b8c6c1'; ctx.font='12px sans-serif'; ctx.textAlign='center';
        ctx.fillText('空', xPos+cellW/2, yPos+cellH/2+4);
      }
      xPos += cellW+gapX;
    }
  }
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = cc.name+'座次表_'+today()+'.png';
  a.click();
  toast('已导出座位图 PNG','ok');
}

  };
  $('#bk-restore').onclick = () => {
    try{
      const obj = JSON.parse($('#bk-text').value);
      if(!obj.classes) throw new Error('格式错误');
      S = obj; save(); closeModal(); render();
      toast('恢复成功','ok');
    }catch(e){ toast('JSON 格式错误：'+e.message,'err'); }
  };
}

/* ===== 语音控制 ===== */
let voiceRec = null, voiceOn = false, voiceRestart = false, voiceLock = false;
function setVoiceStatus(html){ const el = $('#voice-status'); if(el) el.innerHTML = html; }
function initVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ return null; }
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.onstart = () => { voiceOn = true; $('#voice-btn').classList.add('active'); $('#voice-btn').textContent = '🔴 正在听'; setVoiceStatus('正在聆听…说"点名""停止""点赞""加油"'); };
  rec.onend = () => {
    if(voiceRestart){
      // 延迟重启，避免状态冲突；失败则重试一次
      setTimeout(() => {
        if(!voiceRestart) return;
        try{ rec.start(); }catch(e){
          setTimeout(() => { if(voiceRestart){ try{ rec.start(); }catch(err){} } }, 300);
        }
      }, 200);
    } else {
      voiceOn = false; $('#voice-btn').classList.remove('active'); $('#voice-btn').textContent = '🎤 语音控制'; setVoiceStatus('已关闭，点击开启语音控制');
    }
  };
  rec.onerror = e => {
    // no-speech / aborted 是正常中断，不停止自动重启
    if(e.error === 'no-speech' || e.error === 'aborted'){ return; }
    voiceRestart = false;
    voiceOn = false;
    $('#voice-btn').classList.remove('active');
    $('#voice-btn').textContent = '🎤 语音控制';
    const errMap = {
      'not-allowed': '麦克风权限被拒绝，请在地址栏🔒图标里允许麦克风',
      'service-not-allowed': '语音服务被禁用，请检查浏览器设置',
      'audio-capture': '未检测到麦克风设备，请检查麦克风是否连接',
      'network': '网络错误，语音识别需要联网',
      'language-not-supported': '不支持中文语音识别'
    };
    const msg = errMap[e.error] || ('语音错误：'+e.error);
    setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
    toast(msg, 'err');
  };
  rec.onresult = e => {
    if(voiceLock) return;
    let text = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      text += e.results[i][0].transcript;
    }
    text = text.trim();
    if(!text) return;
    setVoiceStatus('听到：<span class="cmd">'+esc(text)+'</span>');
    if(handleVoiceCommand(text)){
      voiceLock = true;
      setTimeout(() => { voiceLock = false; }, 800);
      // 不停止识别，保持常开，靠 voiceLock 防抖
    }
  };
  return rec;
}
function handleVoiceCommand(text){
  const t = text.toLowerCase().replace(/\s/g,'');
  const hasPop = !!$('#avatar-pop-mask');
  // 弹窗打开时：点赞 / 加油 / 关闭
  if(hasPop){
    if(/(点赞|很棒|不错|完美|回答得好|答得好|很好|真棒|好的)/.test(t)){ $('#av-like')?.click(); return true; }
    if(/(加油|继续|再努力|下次|还行|一般|勉励)/.test(t)){ $('#av-cheer')?.click(); return true; }
    if(/(关闭|关掉|知道了|下一个|明白|好了|可以了)/.test(t)){ closeAvatarPop(); $$('.seat.picked').forEach(el=>el.classList.remove('picked')); $('#roll-display').innerHTML='<div class="big">点击下方按钮</div><div class="sub">开始随机点名抽答</div>'; return true; }
  }
  // 滚动中：停止
  if(rolling){
    if(/(停|停止|确定|就是你|停下|选他|就是他|就你|定|好就你)/.test(t)){ stopRoll(); return true; }
  }
  // 空闲：点名
  if(!rolling && !hasPop){
    if(/(点名|开始点名|抽人|抽一个|下一位|开始|随机|选人|提问)/.test(t)){ startRoll(); return true; }
  }
  return false;
}
function toggleVoice(){
  if(!voiceRec){ voiceRec = initVoice(); if(!voiceRec){ toast('当前浏览器不支持语音识别，请用Chrome或Edge','err'); return; } }
  if(voiceOn){
    voiceRestart = false;
    voiceRec.stop();
  } else {
    // 检查安全上下文（HTTPS或localhost）
    if(!window.isSecureContext){
      const msg = '当前页面不是安全环境（需HTTPS或localhost），无法使用麦克风。请用 http://localhost 打开或部署到HTTPS网站';
      setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
      toast(msg, 'err');
      return;
    }
    voiceRestart = true;
    try{
      voiceRec.start();
      setVoiceStatus('正在启动麦克风…');
    }catch(e){
      voiceRestart = false;
      const msg = '启动失败：'+(e.message||e)+'。请确认已允许麦克风权限，且页面通过HTTPS或localhost访问';
      setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
      toast(msg, 'err');
    }
  }
}

/* ===== 绑定 & 初始化 ===== */
function bindTop(){
  $('#btn-import').onclick = importModal;
  $('#btn-avatars').onclick = importAvatars;
  $('#btn-export').onclick = exportCSV;
  $('#btn-exportimg').onclick = exportPNG;
  $('#btn-layout').onclick = layoutModal;
  $('#btn-print').onclick = printBoard;
  $('#btn-backup').onclick = backupModal;
  $('#roll-btn').onclick = () => { rolling ? stopRoll() : startRoll(); };
  $('#voice-btn').onclick = toggleVoice;
  $('#opt-norepeat').onchange = e => { S.noRepeat = e.target.checked; save(); renderStats(); };
  $('#opt-seat').onchange = e => { S.showSeat = e.target.checked; save(); };
  $('#btn-resetans').onclick = () => { curClass().called=[]; save(); renderStats(); renderBoard(); renderHistory(); toast('已重置已答标记','ok'); };
  $('#btn-clearhist').onclick = () => { curClass().history=[]; save(); renderHistory(); toast('已清空点名记录','ok'); };
  $('#btn-flip').onclick = () => { S.flipPodium = !S.flipPodium; save(); renderBoard(); toast('讲台视角已切换','ok'); };
  $('#btn-autoseat').onclick = autoSeat;
  $('#btn-clearseat').onclick = () => { if(confirm('确定清空所有座位和点名记录？')) clearSeats(); };
  $$('#side-tabs button').forEach(b => b.onclick = () => {
    $$('#side-tabs button').forEach(x => x.classList.toggle('active', x===b));
    $$('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-'+b.dataset.t));
  });
}
function init(){
  load();
  bindTop();
  render();
  window.addEventListener('resize', () => { clearTimeout(window._fitT); window._fitT = setTimeout(fitBoard, 100); });
}
init();
</script>
